<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Predictor</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 50%, #a18cd1 100%);
            padding: 16px;
            overflow-x: hidden;
        }

        /* Floating hearts in the background */
        .hearts span {
            position: fixed;
            bottom: -40px;
            font-size: 24px;
            opacity: 0.6;
            animation: floatUp 8s linear infinite;
            pointer-events: none;
        }
        .hearts span:nth-child(1) { left: 10%; animation-delay: 0s; }
        .hearts span:nth-child(2) { left: 25%; animation-delay: 2s; font-size: 18px; }
        .hearts span:nth-child(3) { left: 45%; animation-delay: 4s; }
        .hearts span:nth-child(4) { left: 65%; animation-delay: 1s; font-size: 30px; }
        .hearts span:nth-child(5) { left: 85%; animation-delay: 3s; font-size: 20px; }

        @keyframes floatUp {
            0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
            10%  { opacity: 0.6; }
            100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }

        .card {
            position: relative;
            z-index: 1;
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 32px 28px;
            border-radius: 22px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .icon {
            font-size: 48px;
            animation: beat 1.2s ease-in-out infinite;
        }

        @keyframes beat {
            0%, 100% { transform: scale(1); }
            50%      { transform: scale(1.15); }
        }

        h3 {
            font-size: 26px;
            color: #e91e63;
            margin: 6px 0 4px;
        }

        .subtitle {
            font-size: 13px;
            color: #888;
            margin-bottom: 24px;
        }

        .names {
            display: flex;
            align-items: flex-end;
            gap: 10px;
        }

        .field {
            flex: 1;
            text-align: left;
        }

        .plus {
            font-size: 22px;
            color: #e91e63;
            padding-bottom: 10px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #555;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #f3c1d3;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            background: #fff7fa;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: #e91e63;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(233, 30, 99, 0.15);
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #ff4b7d, #e91e63);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
        }

        button:hover  { box-shadow: 0 8px 20px rgba(233, 30, 99, 0.35); }
        button:active { transform: scale(0.98); }

        .result {
            margin-top: 24px;
            display: none;
        }

        .result.show { display: block; }

        .percent {
            font-size: 48px;
            font-weight: 700;
            color: #e91e63;
        }

        .bar {
            height: 12px;
            background: #fde4ec;
            border-radius: 6px;
            overflow: hidden;
            margin: 10px 0 14px;
        }

        .bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff9a9e, #e91e63);
            border-radius: 6px;
            transition: width 1.2s ease;
        }

        #message {
            font-size: 15px;
            font-weight: 500;
            color: #555;
        }

        #error {
            margin-top: 14px;
            font-size: 14px;
            color: #e67e00;
        }

        .note {
            margin-top: 20px;
            font-size: 11px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="hearts">
        <span>💖</span><span>💕</span><span>💗</span><span>💞</span><span>💘</span>
    </div>

    <div class="card">
        <div class="icon">❤️</div>
        <h3>Love Predictor</h3>
        <p class="subtitle">Find out your love compatibility</p>

        <div class="names">
            <div class="field">
                <label for="name1">Your Name</label>
                <input type="text" id="name1" placeholder="e.g. Rahul">
            </div>
            <div class="plus">💘</div>
            <div class="field">
                <label for="name2">Partner's Name</label>
                <input type="text" id="name2" placeholder="e.g. Priya">
            </div>
        </div>

        <button onclick="predictLove()">Calculate Love 💕</button>

        <p id="error"></p>

        <div class="result" id="result">
            <div class="percent" id="percent">0%</div>
            <div class="bar"><div class="bar-fill" id="barFill"></div></div>
            <p id="message"></p>
        </div>

        <p class="note">Just for fun, not real science 😄</p>
    </div>

    <script src="love.js"></script>
</body>
</html>
