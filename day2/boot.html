<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <button id="themeToggle" class="theme-toggle" aria-label="Switch colour theme">🌙</button>

  <main class="container">

    <!-- ===== Header: photo with name and details next to it ===== -->
    <header class="profile-card">
      <div class="photo-wrap">
        <img id="photo" class="photo" src="" alt="Profile photo">
        <div id="photoFallback" class="photo-fallback" aria-hidden="true"></div>
      </div>

      <div class="profile-info">
        <h1 id="name"></h1>
        <p id="title" class="title"></p>
        <p id="about" class="about"></p>
        <ul id="contact" class="contact"></ul>
      </div>
    </header>

    <!-- ===== Education ===== -->
    <section class="section">
      <h2 class="section-title">Education</h2>
      <div id="education" class="timeline"></div>
    </section>

    <!-- ===== Achievements ===== -->
    <section class="section">
      <h2 class="section-title">Achievements</h2>
      <div id="achievements" class="achievements"></div>
    </section>

    <!-- ===== Skills ===== -->
    <section class="section">
      <h2 class="section-title">Skills</h2>
      <div id="skills" class="skills"></div>
    </section>

    <footer class="footer">
      <p>&copy; <span id="year"></span> <span id="footerName"></span></p>
    </footer>

  </main>

</body>
</html>
